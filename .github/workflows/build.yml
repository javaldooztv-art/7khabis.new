name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract and Flatten Files
        run: |
          mkdir -p temp_extracted
          unzip -o HaftKhabisVIP* -d temp_extracted
          
          # پیدا کردن محل قرارگیری settings.gradle.kts و انتقال محتویات به ریشه
          SETTINGS_DIR=$(dirname $(find temp_extracted -name "settings.gradle.kts" | head -n 1))
          if [ -n "$SETTINGS_DIR" ] && [ -d "$SETTINGS_DIR" ]; then
            cp -r "$SETTINGS_DIR"/* .
          fi
          
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaftKhabisVIP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
